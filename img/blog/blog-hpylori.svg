  <path d="M556 236 c22 14 34 34 34 60" fill="none" stroke="#2E6B9C" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
  <path d="M516 250 c14 10 22 24 24 42" fill="none" stroke="#2E6B9C" stroke-width="7" stroke-linecap="round" opacity="0.5"/>

  <!-- 5. Foco dorado: el positivo en el papel -->
  <circle cx="275" cy="198" r="46" fill="#C69C6D" opacity="0.16"/>
  <circle cx="275" cy="198" r="26" fill="#C69C6D" opacity="0.30"/>
  <line x1="275" y1="178" x2="275" y2="218" stroke="#C69C6D" stroke-width="11" stroke-linecap="round"/>
  <line x1="255" y1="198" x2="295" y2="198" stroke="#C69C6D" stroke-width="11" stroke-linecap="round"/>
</svg>
