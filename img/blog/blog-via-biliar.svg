  <path d="M414 202 C400 212 392 224 386 240" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" fill="none"/>

  <!-- hepatico comun y coledoco, fuera del higado: en azul para que contrasten -->
  <path d="M386 240 C386 292 392 340 406 380 C412 400 422 412 434 420"
