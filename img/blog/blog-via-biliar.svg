  <path d="M276 296 L292 272" stroke="#2E6B9C" stroke-width="15" stroke-linecap="round"/>

  <!-- el mismo conducto cistico, tres lugares donde puede insertarse -->
  <path d="M296 268 C334 246 362 240 382 244" stroke="#C69C6D" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M302 284 C344 298 372 316 390 332" stroke="#C69C6D" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.45"/>
  <path d="M306 300 C350 336 384 368 408 394" stroke="#C69C6D" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.24"/>

  <!-- el punto donde el cirujano decide que cortar -->
  <circle cx="386" cy="244" r="34" fill="#C69C6D" opacity="0.18"/>
  <circle cx="386" cy="244" r="19" fill="#C69C6D" opacity="0.32"/>
  <circle cx="386" cy="244" r="9" fill="#C69C6D"/>
